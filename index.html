<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earning Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --bkash-color: #d12053;
            --text-color: #ffffff;
            --text-muted: #a1a1aa;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .header h2 {
            color: var(--primary);
            font-size: 18px;
        }

        .admin-gear {
            cursor: pointer;
            font-size: 20px;
            opacity: 0.6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #141414;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-bkash {
            background: var(--bkash-color);
        }

        .btn-danger { background: var(--danger); }

        .hidden { display: none !important; }

        .card {
            background: #141414;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .balance {
            font-size: 26px;
            font-weight: bold;
            color: var(--primary);
            margin: 8px 0;
        }

        .toggle-text {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
        }

        .msg {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        /* Payment Channel Options */
        .payment-channels {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .channel-box {
            flex: 1;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            background: #141414;
        }

        .channel-box.active {
            border-color: var(--primary);
            background: rgba(34, 197, 94, 0.1);
        }

        .copy-box {
            background: #141414;
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .copy-btn {
            background: var(--primary);
            color: black;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Popup Notification */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
        }

        .user-item {
            background: #141414;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <h2 id="pageTitle">Earning Dashboard</h2>
        <span class="admin-gear" onclick="promptAdmin()">⚙️</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>ফোন নম্বর</label>
            <input type="tel" id="loginPhone" placeholder="017XXXXXXXX" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="loginPass" placeholder="পাসওয়ার্ড দিন" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">লগইন</button>
        <div class="toggle-text" onclick="showSignup()">অ্যাকাউন্ট নেই? রেজিস্ট্রেশন করুন</div>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
        <div class="form-group">
            <label>ফোন নম্বর</label>
            <input type="tel" id="signupPhone" placeholder="017XXXXXXXX" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>নতুন পাসওয়ার্ড</label>
            <input type="password" id="signupPass" placeholder="পাসওয়ার্ড দিন" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn">রেজিস্ট্রেশন করুন</button>
        <div class="toggle-text" onclick="showLogin()">অ্যাকাউন্ট আছে? লগইন করুন</div>
    </form>

    <!-- User Dashboard Section -->
    <div id="userDash" class="hidden">
        <div class="card">
            <div>TOTAL BALANCE WALLET</div>
            <div class="balance">৳ <span id="userBal">50.00</span></div>
            <div style="font-size: 12px; color: var(--primary);">অ্যাক্টিভ মেম্বার</div>
        </div>

        <!-- Recharge / Deposit Area -->
        <h4 style="margin-bottom: 10px;">ডিপোজিট করুন (Recharge)</h4>
        
        <div class="payment-channels">
            <div id="chanBkash" class="channel-box active" onclick="selectChannel('bKash')">bKash</div>
            <div id="chanNagad" class="channel-box" onclick="selectChannel('Nagad')">Nagad</div>
        </div>

        <div class="copy-box">
            <div>
                <div style="font-size:11px; color:var(--text-muted);">সেন্ট মানি নাম্বার:</div>
                <div style="font-size:16px; font-weight:bold;" id="depNumber">01872496919</div>
            </div>
            <div class="copy-btn" onclick="copyNumber()">কপি করুন</div>
        </div>

        <div class="form-group">
            <label>পরিমাণ (Amount)</label>
            <input type="number" id="depAmount" placeholder="টাকার পরিমাণ লিখুন">
        </div>

        <div class="form-group">
            <label>১০-সংখ্যার লেনদেন আইডি (TrxID)</label>
            <input type="text" id="trxInput" placeholder="যেমন: 8N7X6Z9Y">
        </div>

        <button class="btn btn-bkash" id="submitDepBtn" onclick="submitTrx()">জমা দিন</button>
        <button class="btn btn-danger" onclick="logout()" style="margin-top: 15px;">🚪 লগআউট করুন</button>
    </div>

    <!-- Secret Admin Panel -->
    <div id="adminPanel" class="hidden">
        <h3 style="color: var(--primary); margin-bottom: 10px;">অ্যাডমিন কন্ট্রোল</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">রেজিস্টার্ড ইউজারদের তালিকা:</p>

        <div id="userList"></div>

        <button class="btn btn-danger" onclick="closeAdmin()" style="margin-top: 15px;">বন্ধ করুন</button>
    </div>

    <div id="statusMsg" class="msg"></div>

</div>

<!-- Copy Notification Toast -->
<div id="toastBox" class="toast hidden">
    <span style="color:var(--primary); font-size:18px;">✔</span> Copy Success
</div>

<script>
    let selectedMethod = "bKash";

    function DB_getUsers() {
        return JSON.parse(localStorage.getItem('app_users')) || {};
    }

    function DB_saveUsers(users) {
        localStorage.setItem('app_users', JSON.stringify(users));
    }

    function showSignup() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('statusMsg').innerText = '';
    }

    function showLogin() {
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('statusMsg').innerText = '';
    }

    function selectChannel(method) {
        selectedMethod = method;
        document.getElementById('chanBkash').classList.toggle('active', method === 'bKash');
        document.getElementById('chanNagad').classList.toggle('active', method === 'Nagad');
    }

    function copyNumber() {
        const num = document.getElementById('depNumber').innerText;
        navigator.clipboard.writeText(num);
        
        const toast = document.getElementById('toastBox');
        toast.classList.remove('hidden');
        setTimeout(() => {
            toast.classList.add('hidden');
        }, 1500);
    }

    function handleSignup(e) {
        e.preventDefault();
        const phone = document.getElementById('signupPhone').value.trim();
        const pass = document.getElementById('signupPass').value.trim();
        const msg = document.getElementById('statusMsg');

        let users = DB_getUsers();
        if (users[phone]) {
            msg.style.color = 'var(--danger)';
            msg.innerText = 'এই নম্বরটি আগে থেকেই রেজিস্টার্ড!';
            return;
        }

        users[phone] = { pass: pass, balance: 50.00 };
        DB_saveUsers(users);

        localStorage.setItem('active_user', phone);
        msg.style.color = 'var(--primary)';
        msg.innerText = 'রেজিস্ট্রেশন সফল!';
        setTimeout(loadDashboard, 800);
    }

    function handleLogin(e) {
        e.preventDefault();
        const phone = document.getElementById('loginPhone').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const msg = document.getElementById('statusMsg');

        let users = DB_getUsers();
        if (!users[phone] || users[phone].pass !== pass) {
            msg.style.color = 'var(--danger)';
            msg.innerText = 'ভুল ফোন নম্বর বা পাসওয়ার্ড!';
            return;
        }

        localStorage.setItem('active_user', phone);
        loadDashboard();
    }

    function loadDashboard() {
        const active = localStorage.getItem('active_user');
        if (!active) return;

        let users = DB_getUsers();
        const user = users[active];

        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('userDash').classList.remove('hidden');

        document.getElementById('userBal').innerText = user ? user.balance.toFixed(2) : '50.00';
    }

    function logout() {
        localStorage.removeItem('active_user');
        document.getElementById('userDash').classList.add('hidden');
        showLogin();
    }

    function submitTrx() {
        const amount = document.getElementById('depAmount').value.trim();
        const trx = document.getElementById('trxInput').value.trim();
        const msg = document.getElementById('statusMsg');

        if (!amount || !trx) {
            msg.style.color = 'var(--danger)';
            msg.innerText = 'পরিমাণ এবং TrxID সঠিকভাবে লিখুন!';
            return;
        }

        msg.style.color = 'var(--primary)';
        msg.innerText = selectedMethod + ' ডিপোজিট রিকোয়েস্ট জমা হয়েছে!';
        document.getElementById('trxInput').value = '';
        document.getElementById('depAmount').value = '';
    }

    // --- Secret Admin Logic ---
    function promptAdmin() {
        const pin = prompt("অ্যাডমিন সিক্রেট PIN দিন:");
        if (pin === "1234") {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('userDash').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');

            renderUsers();
        } else if (pin !== null) {
            alert("ভুল PIN!");
        }
    }

    function renderUsers() {
        const users = DB_getUsers();
        const listContainer = document.getElementById('userList');
        listContainer.innerHTML = '';

        const keys = Object.keys(users);
        if (keys.length === 0) {
            listContainer.innerHTML = '<div style="color:var(--text-muted);">কোনো রেজিস্টার্ড ইউজার নেই।</div>';
            return;
        }

        keys.forEach(phone => {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerHTML = `📱 <b>${phone}</b> | 🔑 Pass: ${users[phone].pass}`;
            listContainer.appendChild(div);
        });
    }

    function closeAdmin() {
        document.getElementById('adminPanel').classList.add('hidden');
        if (localStorage.getItem('active_user')) {
            loadDashboard();
        } else {
            showLogin();
        }
    }

    window.onload = function() {
        if (localStorage.getItem('active_user')) {
            loadDashboard();
        }
    };
</script>

</body>
</html>
